<!doctype html>
<html lang="en">
  <head>
    <title>Project | Portfolio</title>
    <meta name="description" content="Case study from Jabez John Betet's portfolio." />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      var r = document.documentElement;
      r.classList.add('js');
      try {
        var t =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        r.dataset.theme = t;
        sessionStorage.getItem('seen') && r.classList.add('seen');
      } catch (e) {
        r.dataset.theme = 'light';
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="project">
    <div id="loader" class="loader" aria-hidden="true">
      <span class="ld-mark">JB</span><span class="ld-track"><i id="ld-bar"></i></span>
    </div>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="top-in">
        <a class="logo" id="logo" href="index.html" translate="no"></a>
        <nav class="menu" aria-label="Primary">
          <a href="index.html#projects">All Projects</a><a href="index.html#contact">Contact</a>
        </nav>
        <button id="theme" class="tg" type="button" aria-pressed="false">
          <span class="sr">Dark mode</span>
        </button>
      </div>
    </header>
    <main id="main"><div class="wrap">Loading…</div></main>
    <noscript
      ><style>
        .loader {
          display: none;
        }
        .rv,
        .hv {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
      <p class="err">This page needs JavaScript to load its content.</p></noscript
    >
    <script src="js/main.js"></script>
  </body>
</html>
